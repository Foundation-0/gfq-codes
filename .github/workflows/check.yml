# Verifies exact certificate arithmetic and regression controls, not novelty or
# human approval. Checker changes and research results receive separate reviews.
name: Check upper bounds

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the pinned verifiers
        run: sha256sum -c tools/SHA256SUMS
      - name: Run positive and negative controls
        run: python3 -m unittest discover -s tests -v
      - name: Verify research certificates with both algorithms
        shell: bash
        run: |
          for certificate in results/*/certificate.json; do
            [ -f "$certificate" ] || continue
            python3 tools/check_bound.py "$certificate"
            python3 tools/check_bound_independent.py "$certificate"
          done
